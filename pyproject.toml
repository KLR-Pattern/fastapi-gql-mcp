[project]
name = "fastapi-gql-mcp"
version = "0.3.0"
description = "FastAPI → GraphQL → MCP: turn any FastAPI router into a GraphQL query layer + MCP server, zero decorators."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "tangkikodo" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "graphql-core>=3.2,<4",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]

[project.optional-dependencies]
# 4.0.10 has a regression (missing fastmcp.server.tasks.routing on the HTTP
# tool-execution path); 4.0.9 is the newest working release.
mcp = ["fastmcp==4.0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_gql_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastmcp==4.0.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "asgi_lifespan.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
