# Deploys the Comparison page (benchmark visualizations) as a static GitHub
# Pages site. nexusx deploys mkdocs docs the same way; here the "site" is a
# single self-contained Comparison/index.html, so the native Pages actions
# are enough — no build step. Requires Pages enabled in repo settings with
# source "GitHub Actions".
name: GH Pages Deploy

on:
  push:
    branches: [master]
    paths:
      - 'Comparison/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Comparison page
        uses: actions/upload-pages-artifact@v3
        with:
          path: Comparison

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
